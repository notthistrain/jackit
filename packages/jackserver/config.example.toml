[server]
port = 7001

[database]
path = "./data/jackserver.db"

[publish]
token = "change-me-to-a-secret-token"

[metrics]
# 访问量统计（打点）总开关
enabled = true
# 上报签名密钥（嵌入前端 SDK）。注意：前端可见的密钥无法做到密码学级防伪，
# 仅用于提高伪造门槛；真正的兜底是 rate_limit 限流。
track_secret = "940457524"
# 允许上报的来源域名白名单（校验浏览器 Origin / Referer）
allowed_origins = ["http://114.124.36.46", "http://127.0.0.1", "http://localhost"]
# 单 IP 上报限流，格式 "N/unit"（unit: s/m/h，可带倍数如 2s）。例：1/m=每分钟1次、10/s=每秒10次。
rate_limit = "1/m"
